[package]
name = "ava-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "ava"

[[bin]]
name = "ava"
path = "src/main.rs"

[[bin]]
name = "ava-alpha"
path = "src/main.rs"

[[bin]]
name = "ava-cli"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "ava_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
ava-app-server = { workspace = true }
ava-app-server-daemon = { workspace = true }
ava-app-server-protocol = { workspace = true }
ava-app-server-test-client = { workspace = true }
ava-arg0 = { workspace = true }
ava-build-info = { workspace = true }
ava-api = { workspace = true }
ava-aws-auth = { workspace = true }
ava-chatgpt = { workspace = true }
ava-cloud-config = { workspace = true }
ava-cloud-tasks = { path = "../cloud-tasks" }
ava-utils-cli = { workspace = true }
ava-config = { workspace = true }
ava-core = { workspace = true }
ava-core-plugins = { workspace = true }
ava-history = { workspace = true }
ava-home = { workspace = true }
ava-http-client = { workspace = true }
ava-exec = { workspace = true }
ava-exec-server = { workspace = true }
ava-execpolicy = { workspace = true }
ava-extension-api = { workspace = true }
ava-features = { workspace = true }
ava-git-attribution = { workspace = true }
ava-git-utils = { workspace = true }
ava-install-context = { workspace = true }
ava-login = { workspace = true }
ava-memories-write = { workspace = true }
ava-mcp = { workspace = true }
ava-model-provider = { workspace = true }
ava-models-manager = { workspace = true }
ava-plugin = { workspace = true }
ava-protocol = { workspace = true }
ava-responses-api-proxy = { workspace = true }
ava-tcp-tunnel = { workspace = true }
ava-rmcp-client = { workspace = true }
ava-rollout = { workspace = true }
ava-rollout-trace = { workspace = true }
ava-sandboxing = { workspace = true }
ava-skills-extension = { workspace = true }
ava-state = { workspace = true }
ava-stdio-to-uds = { workspace = true }
ava-terminal-detection = { workspace = true }
ava-thread-store = { workspace = true }
ava-tui = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-path = { workspace = true }
ava-utils-path-uri = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
ava_windows_sandbox = { package = "ava-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
ava-utils-cargo-bin = { workspace = true }
ava-utils-pty = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
vt100 = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
