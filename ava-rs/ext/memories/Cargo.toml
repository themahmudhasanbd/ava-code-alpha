[package]
edition.workspace = true
license.workspace = true
name = "ava-memories-extension"
version.workspace = true

[lib]
name = "ava_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
ava-config = { workspace = true }
ava-core = { workspace = true }
ava-extension-api = { workspace = true }
ava-features = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-tools = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-output-truncation = { workspace = true }
ava-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
