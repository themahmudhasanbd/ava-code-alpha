[package]
edition.workspace = true
license.workspace = true
name = "ava-model-provider"
version.workspace = true

[lib]
doctest = false
name = "ava_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
ava-api = { workspace = true }
ava-agent-identity = { workspace = true }
ava-aws-auth = { workspace = true }
ava-http-client = { workspace = true }
ava-feedback = { workspace = true }
ava-login = { workspace = true }
ava-keyring-store = { workspace = true }
ava-model-provider-info = { workspace = true }
ava-models-manager = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-response-debug-context = { workspace = true }
ava-secrets = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
ava-utils-redacted-string = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
