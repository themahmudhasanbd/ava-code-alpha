# ==============================================================================
# AvA Code Alpha - Configuration Template (~/.ava/config.toml or .ava/config.toml)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Active Model & Provider Selection
# ------------------------------------------------------------------------------
# Set the active provider and model to use:
model_provider = "antigravity"
model = "gemini-3.7-flash-tiered"

# Context window & auto-compaction
model_context_window = 1048576
model_auto_compact_token_limit = 900000

# ------------------------------------------------------------------------------
# 2. Built-in Provider Presets
# AvA includes built-in endpoints for popular providers:
# - "antigravity" (Google Antigravity Code Assist - OAuth / env: ANTIGRAVITY_API_KEY)
# - "openrouter"  (env: OPENROUTER_API_KEY)
# - "deepseek"    (env: DEEPSEEK_API_KEY)
# - "groq"        (env: GROQ_API_KEY)
# - "gemini"      (env: GEMINI_API_KEY)
# - "together"    (env: TOGETHER_API_KEY)
# - "mistral"     (env: MISTRAL_API_KEY)
# - "anthropic"   (env: ANTHROPIC_API_KEY)
# - "ollama"      (local http://localhost:11434/v1)
# - "lmstudio"    (local http://localhost:1234/v1)
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 3. Google Antigravity Provider Settings ([model_providers.antigravity])
# ------------------------------------------------------------------------------
[model_providers.antigravity]
name = "Google Antigravity"
base_url = "https://daily-cloudcode-pa.googleapis.com"
env_key = "ANTIGRAVITY_API_KEY"
wire_api = "responses"
# Optional: Set token directly (e.g. ya29...) instead of env var
# experimental_bearer_token = "ya29.a0A..."
[model_providers.antigravity.http_headers]
"User-Agent" = "antigravity/ide/2.5.5 darwin/arm64"
"X-Goog-Api-Client" = "gl-node/22.21.1"

# ------------------------------------------------------------------------------
# 4. Custom AI Providers ([model_providers.<id>])
# You can add ANY OpenAI-compatible endpoint, custom proxy, LiteLLM, or self-hosted API:
# ------------------------------------------------------------------------------

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"
# Optional: Set token directly instead of env var
# experimental_bearer_token = "sk-or-v1-..."
[model_providers.openrouter.http_headers]
"HTTP-Referer" = "https://avacode.dev"
"X-Title" = "AvA Code"

[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com/v1"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

[model_providers.groq]
name = "Groq Cloud"
base_url = "https://api.groq.com/openai/v1"
env_key = "GROQ_API_KEY"
wire_api = "responses"

[model_providers.gemini]
name = "Google Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
env_key = "GEMINI_API_KEY"
wire_api = "responses"

[model_providers.ollama]
name = "Ollama Local"
base_url = "http://localhost:11434/v1"
wire_api = "responses"

[model_providers.custom_proxy]
name = "My Custom Proxy"
base_url = "https://my-custom-proxy.example.com/v1"
env_key = "CUSTOM_API_KEY"
# experimental_bearer_token = "sk-custom-token-here"
wire_api = "responses"
