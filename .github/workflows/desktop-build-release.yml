name: AvA Desktop Standalone Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.15.2-alpha)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-linux-deb:
    name: Build Linux DEB Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository (no submodules)
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ava-rs -> ava-rs/target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dpkg \
            fakeroot

      - name: Install Node Workspace Dependencies
        run: |
          cd ava-desktop
          pnpm install --no-frozen-lockfile

      - name: Build All Workspace Packages
        run: |
          cd ava-desktop
          pnpm build:js

      - name: Build Native AvA Core (codex-app-server release)
        run: |
          cd ava-rs
          cargo build --release -p codex-app-server

      - name: Bundle Agent Runtime Sidecar
        run: |
          cd ava-desktop
          pnpm -C packages/agent-runtime bundle || true

      - name: Build Electron Renderer & Main
        run: |
          cd ava-desktop/apps/desktop
          npx electron-vite build

      - name: Package Linux DEB
        run: |
          cd ava-desktop/apps/desktop
          npx electron-builder --linux deb --publish never

      - name: List release artifacts
        run: ls -lh ava-desktop/apps/desktop/release/

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ava-desktop-linux-deb
          path: |
            ava-desktop/apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Attach DEB to GitHub Release
    needs: build-linux-deb
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download DEB artifact
        uses: actions/download-artifact@v4
        with:
          name: ava-desktop-linux-deb
          path: dist-deb

      - name: Create GitHub Release & Attach DEB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: AvA Code Alpha ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: true
          files: dist-deb/*.deb
          body: |
            ## 🚀 AvA Code Alpha — Linux DEB Release

            Standalone desktop app with embedded native Rust Core (`codex-app-server`).
            No Node.js, Rust or CLI installation required.

            ### Install on Debian/Ubuntu
            ```bash
            sudo dpkg -i ava-code-alpha_*_amd64.deb
            # or
            sudo apt install ./ava-code-alpha_*_amd64.deb
            ```
