name: AvA Mobile Build & CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'ava-mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Android APK & Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ava-mobile/package.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Node Dependencies
        run: |
          cd ava-mobile
          npm install --legacy-peer-deps

      - name: Typecheck Mobile React Native
        run: |
          cd ava-mobile
          npx tsc --noEmit

      - name: Build Flutter v1 Android APK
        run: |
          if [ -d "ava-mobile/v1" ]; then
            cd ava-mobile/v1
            flutter pub get
            flutter build apk --release || true
          fi

      - name: Prebuild & Assemble Android APK (Expo v2)
        run: |
          cd ava-mobile
          npx expo prebuild --platform android --clean || true
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease || ./gradlew assembleDebug || true
          fi

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ava-mobile-artifacts
          path: |
            ava-mobile/android/app/build/outputs/apk/**/*.apk
            ava-mobile/v1/build/app/outputs/flutter-apk/*.apk
            ava-mobile/dist/
          if-no-files-found: warn
