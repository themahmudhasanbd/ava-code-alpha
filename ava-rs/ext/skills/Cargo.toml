[package]
edition.workspace = true
license.workspace = true
name = "ava-skills-extension"
version.workspace = true

[lib]
name = "ava_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ava-analytics = { workspace = true }
ava-config = { workspace = true }
ava-exec-server = { workspace = true }
ava-extension-api = { workspace = true }
ava-mcp = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-skills = { workspace = true }
ava-tools = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-path-uri = { workspace = true }
ava-utils-plugins = { workspace = true }
ava-utils-string = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
assert_matches = { workspace = true }
ava-models-manager = { workspace = true }
ava-utils-cargo-bin = { workspace = true }
dunce = { workspace = true }
insta = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
