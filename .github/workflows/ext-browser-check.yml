name: Browser Extension Quick Check

on:
  workflow_dispatch:
  push:
    branches:
      - browser-fix-*
    paths:
      - 'ava-rs/ext/browser/**'
      - '.github/workflows/ext-browser-check.yml'

jobs:
  check:
    name: cargo check ava-browser-extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check browser extension crate only
        run: cd ava-rs && cargo check -p ava-browser-extension
