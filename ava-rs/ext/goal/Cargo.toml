[package]
edition.workspace = true
license.workspace = true
name = "ava-goal-extension"
version.workspace = true

[lib]
name = "ava_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ava-analytics = { workspace = true }
ava-core = { workspace = true }
ava-extension-api = { workspace = true }
ava-otel = { workspace = true }
ava-prompts = { workspace = true }
ava-protocol = { workspace = true }
ava-rollout = { workspace = true }
ava-state = { workspace = true }
ava-tools = { workspace = true }
ava-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
ava-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
