[package]
edition.workspace = true
license.workspace = true
name = "ava-models-manager"
version.workspace = true

[lib]
doctest = false
name = "ava_models_manager"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
ava-http-client = { workspace = true }
ava-login = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-prompts = { workspace = true }
ava-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
