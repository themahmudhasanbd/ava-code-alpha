[package]
edition.workspace = true
license.workspace = true
name = "ava-core"
version.workspace = true

[lib]
name = "ava_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ava-analytics = { workspace = true }
ava-agent-graph-store = { workspace = true }
ava-agent-roles = { workspace = true }
ava-api = { workspace = true }
ava-app-server-protocol = { workspace = true }
ava-apply-patch = { workspace = true }
ava-async-utils = { workspace = true }
ava-attachment-store = { workspace = true }
ava-client = { workspace = true }
ava-code-mode = { workspace = true }
ava-connectors = { workspace = true }
ava-context-fragments = { workspace = true }
ava-config = { workspace = true }
ava-core-plugins = { workspace = true }
ava-diagnostics = { workspace = true }
ava-exec-server = { workspace = true }
ava-extension-api = { workspace = true }
ava-extension-items = { workspace = true }
ava-features = { workspace = true }
ava-feedback = { workspace = true }
ava-file-system = { workspace = true }
ava-login = { workspace = true }
ava-memories-read = { workspace = true }
ava-mcp = { workspace = true }
ava-model-provider-info = { workspace = true }
ava-models-manager = { workspace = true }
ava-shell-command = { workspace = true }
ava-execpolicy = { workspace = true }
ava-git-utils = { workspace = true }
ava-guardian-context = { workspace = true }
ava-guardian-reviewer = { workspace = true }
ava-history = { workspace = true }
ava-hooks = { workspace = true }
ava-http-client = { workspace = true }
ava-install-context = { workspace = true }
ava-network-proxy = { workspace = true }
ava-otel = { workspace = true }
ava-plugin = { workspace = true }
ava-model-provider = { workspace = true }
ava-protocol = { workspace = true }
ava-response-debug-context = { workspace = true }
ava-prompts = { workspace = true }
ava-rollout = { workspace = true }
ava-rollout-trace = { workspace = true }
ava-rmcp-client = { workspace = true }
ava-sandboxing = { workspace = true }
ava-skills = { workspace = true }
ava-skills-extension = { workspace = true }
ava-state = { workspace = true }
ava-terminal-detection = { workspace = true }
ava-thread-store = { workspace = true }
ava-tools = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-audio = { workspace = true }
ava-utils-cache = { workspace = true }
ava-utils-git-discovery = { workspace = true }
ava-utils-image = { workspace = true }
ava-utils-home-dir = { workspace = true }
ava-utils-output-truncation = { workspace = true }
ava-utils-path = { workspace = true }
ava-utils-path-uri = { workspace = true }
ava-utils-plugins = { workspace = true }
ava-utils-pty = { workspace = true }
ava-utils-string = { workspace = true }
ava-utils-stream-parser = { workspace = true }
ava-windows-sandbox = { package = "ava-windows-sandbox", path = "../windows-sandbox-rs" }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5", "v7"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
ava-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
ava-exec-server-test-support = { workspace = true }
ava-image-generation-extension = { workspace = true }
ava-home = { workspace = true }
ava-otel = { workspace = true }
ava-test-binary-support = { workspace = true }
ava-utils-cargo-bin = { workspace = true }
ava-utils-redacted-string = { workspace = true }
ava-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]
