[package]
edition.workspace = true
license.workspace = true
name = "ava-image-generation-extension"
version.workspace = true

[lib]
name = "ava_image_generation_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ava-api = { workspace = true }
ava-core = { workspace = true }
ava-exec-server = { workspace = true }
ava-extension-api = { workspace = true }
ava-extension-items = { workspace = true }
ava-login = { workspace = true }
ava-model-provider = { workspace = true }
ava-model-provider-info = { workspace = true }
ava-protocol = { workspace = true }
ava-tools = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-image = { workspace = true }
ava-utils-path-uri = { workspace = true }
http = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
