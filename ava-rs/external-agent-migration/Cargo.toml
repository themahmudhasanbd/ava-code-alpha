[package]
name = "ava-external-agent-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "ava_external_agent_migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
ava-analytics = { workspace = true }
ava-config = { workspace = true }
ava-core = { workspace = true }
ava-core-plugins = { workspace = true }
ava-hooks = { workspace = true }
ava-login = { workspace = true }
ava-memories-write = { workspace = true }
ava-otel = { workspace = true }
ava-plugin = { workspace = true }
ava-protocol = { workspace = true }
ava-rollout = { workspace = true }
ava-thread-store = { workspace = true }
ava-utils-output-truncation = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
ava-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
