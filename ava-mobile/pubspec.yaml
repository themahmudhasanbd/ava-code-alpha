name: mobile
description: "AvA Code Mobile — Flutter IDE & Agent client connecting to AvA Core Engine."
publish_to: 'none'

version: 1.0.5+5

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.17

  # Networking
  http: ^1.2.0
  web_socket_channel: ^3.0.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Persistence
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^11.1.1

  # Markdown & Code Rendering
  flutter_markdown: ^0.7.4
  markdown: ^7.2.2

  # UI Utilities
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1


  # Image Caching
  cached_network_image: ^3.4.1

  # Environment Configuration
  flutter_dotenv: ^5.2.1
  xterm:
    path: packages/xterm
  file_picker: ^12.2.0

  # Firebase & Push Notifications
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  flutter_math_fork: ^0.7.4


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#09090b"
    theme_color: "#09090b"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/fonts/
    - assets/providers/

  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: "Hind Siliguri"
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
    - family: "Noto Sans Bengali"
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
