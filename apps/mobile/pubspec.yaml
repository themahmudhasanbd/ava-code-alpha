name: ava_code_mobile
description: "AvA Code Alpha Mobile Client — High performance autonomous AI agentic coding system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Icons & Fonts
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  
  # Animations & UI
  flutter_animate: ^4.5.0
  
  # State & Networking
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  shared_preferences: ^2.2.2
  
  # Markdown & Code Highlighting
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/providers/
