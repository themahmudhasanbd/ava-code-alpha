[package]
name = "ava-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

default-run = "ava-app-server"

[[bin]]
name = "ava-app-server"
path = "src/main.rs"

[[bin]]
name = "ava-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "ava_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
ava-analytics = { workspace = true }
ava-agent-extension = { workspace = true }
ava-browser-extension = { workspace = true }
ava-arg0 = { workspace = true }
ava-aws-auth = { workspace = true }
ava-cloud-config = { workspace = true }
ava-code-mode = { workspace = true }
ava-config = { workspace = true }
ava-network-proxy = { workspace = true }
ava-connectors = { workspace = true }
ava-core = { workspace = true }
ava-core-plugins = { workspace = true }
ava-diagnostics = { workspace = true }
ava-home = { workspace = true }
ava-exec-server = { workspace = true }
ava-extension-api = { workspace = true }
ava-external-agent-migration = { workspace = true }
ava-features = { workspace = true }
ava-goal-extension = { workspace = true }
ava-git-attribution = { workspace = true }
ava-guardian-v2 = { workspace = true }
ava-git-utils = { workspace = true }
ava-file-watcher = { workspace = true }
ava-hooks = { workspace = true }
ava-history-notes-extension = { workspace = true }
ava-http-client = { workspace = true }
ava-otel = { workspace = true }
ava-plugin = { workspace = true }
ava-shell-command = { workspace = true }
ava-skills = { workspace = true }
ava-skills-extension = { workspace = true }
ava-utils-cli = { workspace = true }
ava-user-verification = { workspace = true }
ava-utils-pty = { workspace = true }
ava-backend-client = { workspace = true }
ava-file-search = { workspace = true }
ava-chatgpt = { workspace = true }
ava-login = { workspace = true }
ava-image-generation-extension = { workspace = true }
ava-memories-extension = { workspace = true }
ava-web-search-extension = { workspace = true }
ava-memories-write = { workspace = true }
ava-mcp = { workspace = true }
ava-mcp-extension = { workspace = true }
ava-model-provider = { workspace = true }
ava-model-provider-info = { workspace = true }
ava-models-manager = { workspace = true }
ava-prompts = { workspace = true }
ava-protocol = { workspace = true }
ava-queue-extension = { workspace = true }
ava-app-server-protocol = { workspace = true }
ava-app-server-transport = { workspace = true }
ava-feedback = { workspace = true }
ava-rmcp-client = { workspace = true }
ava-rollout = { workspace = true }
ava-sandboxing = { workspace = true }
ava-state = { workspace = true }
ava-thread-store = { workspace = true }
ava-tools = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-json-to-toml = { workspace = true }
ava-utils-path-uri = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
