name: AvA App Server Linux Quick Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-app-server:
    name: Build App Server (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ava-rs -> ava-rs/target

      - name: Build App Server Binary
        run: |
          cd ava-rs
          cargo build --release --target x86_64-unknown-linux-gnu -p ava-app-server --bin ava-app-server

      - name: Package Binary
        shell: bash
        run: |
          mkdir -p dist
          cp ava-rs/target/x86_64-unknown-linux-gnu/release/ava-app-server dist/
          tar -czf "ava-core-x86_64-unknown-linux-gnu.tar.gz" -C dist .

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ava-core-x86_64-unknown-linux-gnu
          path: ava-core-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
