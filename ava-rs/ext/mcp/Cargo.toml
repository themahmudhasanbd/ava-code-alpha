[package]
edition.workspace = true
license.workspace = true
name = "ava-mcp-extension"
version.workspace = true

[lib]
name = "ava_mcp_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ava-core = { workspace = true }
ava-core-plugins = { workspace = true }
ava-config = { workspace = true }
ava-connectors = { workspace = true }
ava-connectors-extension = { workspace = true }
ava-exec-server = { workspace = true }
ava-extension-api = { workspace = true }
ava-features = { workspace = true }
ava-mcp = { workspace = true }
ava-plugin = { workspace = true }
ava-protocol = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
core_test_support = { workspace = true }
axum = { workspace = true }
ava-exec-server-test-support = { workspace = true }
ava-login = { workspace = true }
futures = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
wiremock = { workspace = true }
