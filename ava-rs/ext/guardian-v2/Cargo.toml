[package]
edition.workspace = true
license.workspace = true
name = "ava-guardian-v2"
version.workspace = true

[lib]
name = "ava_guardian_v2"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
ava-analytics = { workspace = true }
ava-api = { workspace = true }
ava-config = { workspace = true }
ava-context-fragments = { workspace = true }
ava-core = { workspace = true }
ava-extension-api = { workspace = true }
ava-features = { workspace = true }
ava-guardian-context = { workspace = true }
ava-guardian-reviewer = { workspace = true }
ava-history = { workspace = true }
ava-http-client = { workspace = true }
ava-login = { workspace = true }
ava-model-provider = { workspace = true }
ava-protocol = { workspace = true }
ava-prompts = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
ava-model-provider-info = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
