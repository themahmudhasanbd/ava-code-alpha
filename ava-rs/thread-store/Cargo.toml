[package]
edition.workspace = true
license.workspace = true
name = "ava-thread-store"
version.workspace = true

[lib]
name = "ava_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
ava-app-server-protocol = { workspace = true }
ava-extension-items = { workspace = true }
ava-git-utils = { workspace = true }
ava-install-context = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-rollout = { workspace = true }
ava-state = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-path = { workspace = true }
ava-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
ava-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
