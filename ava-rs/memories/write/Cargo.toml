[package]
edition.workspace = true
license.workspace = true
name = "ava-memories-write"
version.workspace = true

[lib]
name = "ava_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
ava-backend-client = { workspace = true }
ava-core = { workspace = true }
ava-config = { workspace = true }
ava-features = { workspace = true }
ava-git-utils = { workspace = true }
ava-login = { workspace = true }
ava-model-provider = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-rollout = { workspace = true }
ava-rollout-trace = { workspace = true }
ava-secrets = { workspace = true }
ava-state = { workspace = true }
ava-terminal-detection = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-output-truncation = { workspace = true }
ava-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
ava-model-provider-info = { workspace = true }
ava-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
