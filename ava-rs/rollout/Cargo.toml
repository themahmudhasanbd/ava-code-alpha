[package]
edition.workspace = true
license.workspace = true
name = "ava-rollout"
version.workspace = true

[lib]
doctest = false
name = "ava_rollout"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ava-extension-items = { workspace = true }
ava-file-search = { workspace = true }
ava-git-utils = { workspace = true }
ava-history = { workspace = true }
ava-otel = { workspace = true }
ava-protocol = { workspace = true }
ava-state = { workspace = true }
ava-utils-absolute-path = { workspace = true }
ava-utils-path = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
] }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
ava-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
