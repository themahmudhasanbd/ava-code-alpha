name: AvA Mobile Build & CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'ava-mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ava-mobile/package.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Node Dependencies
        run: |
          cd ava-mobile
          npm install --legacy-peer-deps

      - name: Typecheck Mobile React Native
        run: |
          cd ava-mobile
          npx tsc --noEmit

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          cd ava-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Find & Verify APK Outputs
        run: |
          echo "=== Built APK Outputs ==="
          find ava-mobile/android/app/build/outputs/apk/ -name "*.apk" -ls

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ava-code-mobile-android-apk
          path: |
            ava-mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
